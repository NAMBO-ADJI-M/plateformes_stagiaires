name: plateforme_stagiaires
description: "Application Flutter pour le carnet de stage et le covoiturage"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^9.0.0
  qr_flutter: ^4.1.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/